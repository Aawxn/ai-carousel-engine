<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Just Sortd Carousel Slide Template</title>
  <style>
    :root {
      --bg-primary: #0F1115;
      --bg-card: #181B22;
      --text-main: #FFFFFF;
      --text-muted: #9CA3AF;
      --accent-brand: #F59E0B;
      --accent-green: #10B981;
      --border-subtle: #282E3A;
      --font-header: 'Syne', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-body);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px;
      overflow: hidden;
      position: relative;
    }

    /* Subtle grid pattern */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: linear-gradient(var(--border-subtle) 1px, transparent 1px),
                        linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.15;
      pointer-events: none;
    }

    /* Header bar */
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .brand-tag {
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent-brand);
    }

    .slide-number {
      font-size: 22px;
      color: var(--text-muted);
      font-weight: 600;
      background: var(--bg-card);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
    }

    /* Main Content Container */
    .slide-content {
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 920px;
    }

    .headline {
      font-family: var(--font-header);
      font-size: 56px;
      line-height: 1.15;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .stat-pill {
      display: inline-block;
      align-self: flex-start;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--accent-brand);
      color: var(--accent-brand);
      font-size: 26px;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 12px;
    }

    .body-text {
      font-size: 28px;
      line-height: 1.5;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Footer bar */
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-subtle);
      padding-top: 30px;
      z-index: 2;
    }

    .swipe-indicator {
      font-size: 20px;
      color: var(--accent-brand);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .handle {
      font-size: 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="slide-header">
    <div class="brand-tag">JUST SORTD • D2C OPS</div>
    <div class="slide-number">Slide 5 / 5</div>
  </div>

  <!-- Content Slot -->
  <div class="slide-content">
    
    <div class="stat-pill">JUST SORTD OPS</div>
    

    <h1 class="headline">Execution is the only marketing that matters in Q4.</h1>

    <p class="body-text">Share with your D2C operations team. Follow @justsortd for daily playbooks.</p>
  </div>

  <!-- Footer -->
  <div class="slide-footer">
    <div class="handle">@justsortd</div>
    <div class="swipe-indicator">Save this post 🔖</div>
  </div>
</body>
</html>
